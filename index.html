<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="เครื่องคิดเลขและเครื่องมือคำนวณครบวงจร" />
  <title>คิดครบ — All-in-one Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top"><b>+</b>คิดครบ</a>
    <div class="top-actions">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="ค้นหาเครื่องมือ..." autocomplete="off" /></label>
      <select id="language" aria-label="ภาษา"><option value="th">ไทย</option><option value="en">EN</option></select>
      <button id="theme-toggle" class="round-button" type="button" aria-label="เปลี่ยนธีม">☾</button>
    </div>
  </header>

  <main id="top" class="app-shell">
    <aside class="sidebar">
      <p class="side-label">เลือกหมวด</p>
      <nav id="category-nav" aria-label="หมวดเครื่องคิดเลข">
        <button class="category active" data-category="basic"><i>01</i><span>พื้นฐาน<small>เครื่องคิดเลข</small></span></button>
        <button class="category" data-category="math"><i>02</i><span>คณิตศาสตร์<small>สถิติ · สมการ · จำนวน</small></span></button>
        <button class="category" data-category="geometry"><i>03</i><span>เรขาคณิต<small>รูปทรง · รูปร่าง</small></span></button>
        <button class="category" data-category="finance"><i>04</i><span>การเงิน<small>เงินกู้ · ค่าเงิน</small></span></button>
        <button class="category" data-category="units"><i>05</i><span>แปลงหน่วย<small>ความยาว · น้ำหนัก · เวลา</small></span></button>
        <button class="category" data-category="health"><i>06</i><span>สุขภาพ<small>BMI · TDEE · การวิ่ง</small></span></button>
        <button class="category" data-category="date"><i>07</i><span>วันและเวลา<small>อายุ · ช่วงเวลา</small></span></button>
      </nav>
      <div class="side-note"><b>เคล็ดลับ</b><span>ใส่ค่าได้เลย ระบบตรวจข้อมูลให้</span></div>
    </aside>
    <section class="workspace">
      <div id="search-results" class="search-results" hidden></div>
      <div id="view" aria-live="polite"></div>
    </section>
  </main>
  <footer><span>คิดครบ</span><span>ผลลัพธ์เพื่อการคำนวณเบื้องต้น</span><span>v0.2</span></footer>
  <script src="app.js"></script>
  <script src="extras.js"></script>
</body>
</html>
